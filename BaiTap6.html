<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Học web chuẩn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ul {
            list-style: none;
        }

        body {
            background-color: #f8f8f8;
            color: #1c1b1b;
            font-family: Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            padding: 20px;
        }

        a {
            color: #555;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s color;
        }

        a:hover {
            color: #359a9a;
        }

        .clearfix {
            zoom: 1;
        }

        .clearfix:after {
            clear: both;
            content: ".";
            display: block;
            height: 0;
            line-height: 0;
            visibility: hidden;
        }

        .portfolio {
            margin: 30px auto;
            width: 1170px;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .portfolio h2 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
            text-align: center;
        }

        .portfolio h2:after {
            background-color: #339999;
            content: "";
            display: block;
            height: 3px;
            margin: 11px auto 30px;
            position: relative;
            width: 75px;
        }

        .portfolio .list-tab {
            margin-bottom: 40px;
            text-align: center;
        }

        .portfolio .list-tab li {
            display: inline-block;
            font-size: 17px;
            margin-right: 20px;
        }

        .portfolio .list-tab li:last-child {
            margin-right: 0;
        }

        .portfolio .list-tab li.active a,
        .portfolio .list-tab li a:hover {
            color: #359a9a;
        }

        .portfolio .galerry {
            background-color: #fff;
            padding: 0;
            width: 1090px; 
            margin: 0 auto;
        }

        .portfolio .galerry li {
            float: left;
            margin-right: 20px;
            margin-bottom: 20px;
            width: 350px;
        }

        .portfolio .galerry li:nth-child(3n) {
            margin-right: 0; 
        }

        .portfolio .galerry li:nth-last-of-type(-n+3) {
            margin-bottom: 0;
        }

        .portfolio .galerry li a img {
            width: 350px;
            height: 260px;
            display: block;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <section class="portfolio">
        <h2>MY PORTFOLIO</h2>
        <ul class="list-tab">
            <li class="active"><a href="./">All</a></li>
            <li><a href="./">Web App</a></li>
            <li><a href="./">UI/UX</a></li>
            <li><a href="./">Graphics Design</a></li>
            <li><a href="./">Mobile App</a></li>
            <li><a href="./">Branding</a></li>
            <li><a href="./">Marketing</a></li>
        </ul>
        <ul class="galerry clearfix">
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
            <li><a href="./"><img src="https://hocwebchuan.com/exercises/images/img_350x260.png" alt=""></a></li>
        </ul>
    </section>
</body>

</html>
