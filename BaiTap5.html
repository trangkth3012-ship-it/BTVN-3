<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Khoa CNTTKD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .best-shared {
            text-align: center;
            padding: 40px;
        }
        .best-shared .logo img {
            width: 200px;
        }

        .best-shared h2 {
            font-size: 36px;
            color: #333;
        }
        .best-shared h2 strong {
            color: #00BFFF;
        }

        .best-shared .lead-text {
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
        }

        .btn-list {
            list-style-type: none;
            padding: 0;
        }

        .btn-list li {
            display: inline-block;
            margin-right: 0 10px;
        }

        .btn-list li a {
            color: #fff;
            background-color: #333;
            padding: 12px 25px;
            border-radius: 5px;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn-list li a:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <section class="best-shared">
        <p class="logo"><img style="width:200px" src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" alt=""></p>

        <h2>Best <strong>Shared Hosting</strong>
            Company</h2>
        <p class="lead-text">With this responsive landing page
            template, you can promote your all hosting, domain and email
            services.</p>
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>
</body>

</html>
