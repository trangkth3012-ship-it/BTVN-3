<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7</title>
    <style>
        .container {
            width: 350px;
            margin: 30px auto;
        }

        .label {
            font-size: 14px;
            margin-bottom: 2px;
        }

        #wrapper {
            border: 2px solid #333;
            padding: 10px;
        }

        header {
            border: 2px solid #333;
            padding: 15px;
            margin-bottom: 10px;
            text-align: left;
        }

        nav {
            width: 80px;
            height: 250px;
            border: 2px solid #333;
            float: left;
            margin-right: 10px;
            margin-bottom: 10px;
            padding: 10px;
        }

        main {
            height: 250px;
            border: 2px solid #333;
            overflow: hidden; 
            margin-bottom: 10px;
            padding: 10px;
        }

        footer {
            border: 2px solid #333;
            padding: 15px;
            clear: both;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">wrapper</div>
        <div id="wrapper">
            <header>header</header>
            <nav>nav</nav>
            <main>main</main>
            <footer>footer</footer>
        </div>
    </div>
</body>

</html>
